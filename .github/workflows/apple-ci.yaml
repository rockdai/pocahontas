name: Apple Unit Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocahontas-apple-ci
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository == 'rockdai/pocahontas' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, pocahontas]
    timeout-minutes: 30
    steps:
      - name: Checkout trusted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Run unit tests
        run: swift test --package-path Packages/PocahontasKit -j 4 --skip IntegrationTests
