name: pocahontas
options:
  bundleIdPrefix: com.rockdai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    POCAHONTAS_SERVER_URL: "https://pocahontas-api.rockdai.com"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  PocahontasKit:
    path: Packages/PocahontasKit
targets:
  pocahontas:
    productName: Pocahontas
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared, Terminal/Ghostty, Terminal/iOS]
    dependencies:
      - package: PocahontasKit
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockdai.pocahontas
        PRODUCT_NAME: Pocahontas
        PRODUCT_MODULE_NAME: pocahontas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Pocahontas.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Apps/iOS/Simulator.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: [-ObjC, -lstdc++]
        ENABLE_BITCODE: false
        LM_SKIP_METADATA_EXTRACTION: YES
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Pocahontas
        PocahontasServerURL: "$(POCAHONTAS_SERVER_URL)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: pocahontas connects to your SSH development machines on the local network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
  pocahontas-macOS:
    productName: Pocahontas
    type: application
    platform: macOS
    sources: [Apps/macOS, Apps/Shared, Terminal/Ghostty, Terminal/macOS]
    dependencies:
      - package: PocahontasKit
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: Carbon.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockdai.pocahontas.mac
        PRODUCT_MODULE_NAME: PocahontasMac
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        PRODUCT_NAME: Pocahontas
        POCAHONTAS_MAC_TEST_PORT: "62225"
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Pocahontas.entitlements
        OTHER_LDFLAGS: [-ObjC, -lstdc++]
        ENABLE_HARDENED_RUNTIME: YES
        LM_SKIP_METADATA_EXTRACTION: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          # The sandbox pins a container to its first signer; a shared ID hangs ad-hoc builds at launch.
          PRODUCT_BUNDLE_IDENTIFIER: com.rockdai.pocahontas.mac.debug
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Pocahontas
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PocahontasServerURL: "$(POCAHONTAS_SERVER_URL)"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        NSRequiresAquaSystemAppearance: true
        NSLocalNetworkUsageDescription: pocahontas connects to your SSH development machines on the local network.
  PocahontasMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/macOS, Tests/Shared]
    dependencies:
      - target: pocahontas-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pocahontas.app/Contents/MacOS/Pocahontas"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/macOSUI, Tests/AccountUI]
    dependencies:
      - target: pocahontas-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: pocahontas-macOS
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/iOS, Tests/Shared]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pocahontas.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pocahontas"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/Screenshots]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasLibraryScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/LibraryScreenshots
      - Tests/AccountUI
      - path: Packages/PocahontasKit/Tests/PocahontasKitTests/Fixtures/ed25519_plain
        buildPhase: resources
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasSessionScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/SessionScreenshots]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
schemes:
  session-screenshots:
    build:
      targets:
        pocahontas: all
    test:
      environmentVariables:
        POCAHONTAS_SESSION_TEST_PORT: "62226"
      targets: [PocahontasAppTests, PocahontasSessionScreenshotTests]
  library-screenshots:
    build:
      targets:
        pocahontas: all
    test:
      environmentVariables:
        POCAHONTAS_ACCOUNT_TEST_URL: "$(POCAHONTAS_SERVER_URL)"
      targets: [PocahontasAppTests, PocahontasLibraryScreenshotTests]
  pocahontas-macOS:
    build:
      targets:
        pocahontas-macOS: all
    test:
      environmentVariables:
        POCAHONTAS_MAC_TEST_PORT: "$(POCAHONTAS_MAC_TEST_PORT)"
        POCAHONTAS_SESSION_TEST_PORT: "$(POCAHONTAS_MAC_TEST_PORT)"
        POCAHONTAS_ACCOUNT_TEST_URL: "$(POCAHONTAS_SERVER_URL)"
      targets: [PocahontasMacTests, PocahontasMacUITests]
  pocahontas:
    build:
      targets:
        pocahontas: all
    test:
      targets: [PocahontasAppTests, PocahontasUITests]
  screenshots:
    build:
      targets:
        pocahontas: all
    test:
      targets: [PocahontasScreenshotTests]
