name: pocahontas
options:
  bundleIdPrefix: com.rockdai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  CloudDebug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    POCAHONTAS_CLOUD_ENABLED: "NO"
    POCAHONTAS_CLOUD_ENVIRONMENT: Development
    POCAHONTAS_PUSH_ENVIRONMENT: development
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  configs:
    CloudDebug:
      POCAHONTAS_CLOUD_ENABLED: "YES"
    Release:
      POCAHONTAS_CLOUD_ENABLED: "YES"
      POCAHONTAS_CLOUD_ENVIRONMENT: Production
      POCAHONTAS_PUSH_ENVIRONMENT: production
packages:
  PocahontasKit:
    path: Packages/PocahontasKit
targets:
  pocahontas:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared, Terminal/Ghostty, Terminal/iOS]
    dependencies:
      - package: PocahontasKit
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockdai.pocahontas
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Pocahontas.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Apps/iOS/Simulator.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: [-ObjC, -lstdc++]
        ENABLE_BITCODE: false
        LM_SKIP_METADATA_EXTRACTION: YES
      configs:
        CloudDebug:
          CODE_SIGN_ENTITLEMENTS: Apps/iOS/Cloud.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/iOS/Cloud.entitlements
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: pocahontas
        PocahontasCloudEnabled: "$(POCAHONTAS_CLOUD_ENABLED)"
        PocahontasKeychainGroup: "$(AppIdentifierPrefix)com.rockdai.pocahontas.shared"
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: pocahontas connects to your SSH development machines on the local network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
  pocahontas-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS, Apps/Shared, Terminal/Ghostty, Terminal/macOS]
    dependencies:
      - package: PocahontasKit
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: Carbon.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockdai.pocahontas.mac
        PRODUCT_MODULE_NAME: PocahontasMac
        POCAHONTAS_MAC_TEST_PORT: "62225"
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Pocahontas.entitlements
        OTHER_LDFLAGS: [-ObjC, -lstdc++]
        ENABLE_HARDENED_RUNTIME: YES
        LM_SKIP_METADATA_EXTRACTION: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        CloudDebug:
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: Apps/macOS/Cloud.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/macOS/Cloud.entitlements
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: pocahontas
        PocahontasCloudEnabled: "$(POCAHONTAS_CLOUD_ENABLED)"
        PocahontasKeychainGroup: "$(AppIdentifierPrefix)com.rockdai.pocahontas.shared"
        NSPrincipalClass: NSApplication
        NSRequiresAquaSystemAppearance: true
        NSLocalNetworkUsageDescription: pocahontas connects to your SSH development machines on the local network.
  PocahontasMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/macOS]
    dependencies:
      - target: pocahontas-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/pocahontas-macOS.app/Contents/MacOS/pocahontas-macOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/macOSUI]
    dependencies:
      - target: pocahontas-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: pocahontas-macOS
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/iOS]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/pocahontas.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/pocahontas"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/Screenshots]
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
  PocahontasLibraryScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/LibraryScreenshots
      - path: Packages/PocahontasKit/Tests/PocahontasKitTests/Fixtures/ed25519_plain
        buildPhase: resources
    dependencies:
      - target: pocahontas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pocahontas
        LM_SKIP_METADATA_EXTRACTION: YES
schemes:
  library-screenshots:
    build:
      targets:
        pocahontas: all
    test:
      targets: [PocahontasLibraryScreenshotTests]
  pocahontas-macOS:
    build:
      targets:
        pocahontas-macOS: all
    test:
      environmentVariables:
        POCAHONTAS_MAC_TEST_PORT: "$(POCAHONTAS_MAC_TEST_PORT)"
      targets: [PocahontasMacTests, PocahontasMacUITests]
  pocahontas:
    build:
      targets:
        pocahontas: all
    test:
      targets: [PocahontasAppTests, PocahontasUITests]
  screenshots:
    build:
      targets:
        pocahontas: all
    test:
      targets: [PocahontasScreenshotTests]
  pocahontas-iCloud:
    build:
      targets:
        pocahontas: all
    run:
      config: CloudDebug
    archive:
      config: Release
  pocahontas-macOS-iCloud:
    build:
      targets:
        pocahontas-macOS: all
    run:
      config: CloudDebug
    archive:
      config: Release
